# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

jobs:
  build-platforms:
    name: ".NET / ${{ matrix.platform }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: x64
          - os: windows-11-arm
            platform: ARM64

    steps:
    - uses: actions/checkout@v5
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'
        dotnet-quality: 'ga'
    - name: Restore dependencies
      run: dotnet restore -p:Platform=${{ matrix.platform }}
    - name: Build
      run: dotnet build --no-restore -p:Platform=${{ matrix.platform }}
    - name: Build release
      run: dotnet build --configuration Release --no-restore -p:Platform=${{ matrix.platform }}
    - name: Validate architecture package
      shell: pwsh
      run: |
        dotnet pack madowaku/madowaku.csproj -c Release -o artifacts/packages -p:Platform=${{ matrix.platform }}
        if ($LASTEXITCODE -ne 0) { throw 'Packing failed.' }
        $package = Get-ChildItem artifacts/packages -Filter '*.nupkg' | Select-Object -First 1
        ./tools/Test-ArchitecturePackage.ps1 -PackagePath $package.FullName
    - name: Test
      run: |
        $resultsDir = Join-Path $PWD.Path 'artifacts/test-results/debug'
        New-Item -ItemType Directory -Force -Path $resultsDir | Out-Null

        dotnet test --no-build -p:Platform=${{ matrix.platform }} `
          --results-directory "$resultsDir" `
          --report-trx `
          --output Detailed
    - name: Test release
      run: |
        $resultsDir = Join-Path $PWD.Path 'artifacts/test-results/release'
        New-Item -ItemType Directory -Force -Path $resultsDir | Out-Null

        dotnet test -c Release --no-build -p:Platform=${{ matrix.platform }} `
          --results-directory "$resultsDir" `
          --report-trx `
          --output Detailed `
          --coverage `
          --coverage-output-format cobertura `
          --coverage-settings "$PWD/.config/coverage.settings.xml"
    - name: Generate coverage report
      if: always()
      run: |
        $reportGeneratorVersion = '5.5.9'
        if (dotnet tool list -g | Select-String -SimpleMatch 'dotnet-reportgenerator-globaltool') {
          dotnet tool update -g dotnet-reportgenerator-globaltool --version $reportGeneratorVersion
        }
        else {
          dotnet tool install -g dotnet-reportgenerator-globaltool --version $reportGeneratorVersion
        }

        if (-not (Test-Path artifacts)) {
          Write-Warning 'No artifacts directory found; skipping report generation.'
          exit 0
        }
        $reports = @(
          Get-ChildItem -Path artifacts -Recurse -Filter '*.cobertura.xml' -ErrorAction SilentlyContinue |
            ForEach-Object { $_.FullName }
        )
        if ($reports.Count -eq 0) {
          Write-Warning 'No cobertura reports found; skipping report generation.'
          exit 0
        }
        $reportsArg = ($reports -join ';')
        New-Item -ItemType Directory -Force -Path artifacts/coverage | Out-Null
        # Source-generator output (CsWin32, ResxSourceGenerator, etc.) is
        # filtered out at collection time via .config/coverage.settings.xml so
        # coverage reflects only hand-written madowaku source.
        reportgenerator `
          "-reports:$reportsArg" `
          -targetdir:artifacts/coverage `
          -reporttypes:'Cobertura;HtmlInline;MarkdownSummaryGithub' `
          -title:'madowaku'
        if (Test-Path artifacts/coverage/SummaryGithub.md) {
          Get-Content artifacts/coverage/SummaryGithub.md |
            Add-Content -Path $env:GITHUB_STEP_SUMMARY
        }
    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report-${{ matrix.platform }}
        path: artifacts/coverage
        if-no-files-found: warn
        retention-days: 14
    - name: Upload coverage to Codecov
      if: always()
      uses: codecov/codecov-action@v5
      with:
        files: artifacts/coverage/Cobertura.xml
        # Coverage upload is informational and must not gate the build. The
        # Codecov uploader has an intermittent sha256/GPG signature race on the
        # CDN that hard-fails otherwise unrelated PRs (Codecov-side bug, "no
        # security issue" per the maintainers):
        # https://github.com/codecov/codecov-action/issues/1940
        fail_ci_if_error: false
        disable_search: true
        token: ${{ secrets.CODECOV_TOKEN }}
    - name: Upload raw logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: mtp-logs-${{ matrix.platform }}
        path: |
          artifacts/test-results/**/*.trx
        if-no-files-found: warn
        retention-days: 14

  build:
    name: ".NET / build"
    needs: build-platforms
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Require both platform builds
      env:
        PLATFORM_BUILD_RESULT: ${{ needs.build-platforms.result }}
      run: test "$PLATFORM_BUILD_RESULT" = success
